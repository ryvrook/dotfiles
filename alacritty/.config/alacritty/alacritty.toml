[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"


[window]
opacity = 0.90
blur = true
padding = { x = 6, y = 6 }
dynamic_padding = true
decorations = "Buttonless"

[font]
size = 13.0

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[cursor]
style = { shape = "Block", blinking = "On" }

[general]
live_config_reload = true
# import = [
#     "~/.config/alacritty/themes/tokyo_night.toml"
# ]

[colors.primary]
background = '#000000'
foreground = '#FFFFFF'

# Normal Colours
[colors.normal]
black   = '#1a1a1a'
red     = '#f4005f'
green   = '#98e024'
yellow  = '#fa8419'
blue    = '#9d65ff'
magenta = '#f4005f'
cyan    = '#58d1eb'
white   = '#c4c5b5'

# Bright Colours
[colors.bright]
black   = '#625e4c'
red     = '#f4005f'
green   = '#98e024'
yellow  = '#e0d561'
blue    = '#9d65ff'
magenta = '#f4005f'
cyan    = '#58d1eb'
white   = '#f6f6ef'
