name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix flake check --no-build

  stow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y stow
      - run: >
          stow --no --verbose --target "$(mktemp -d)"
          alacritty bash fish starship bat git gh ssh tmux nvim zed
          niri noctalia gtk desktop vesktop btop fastfetch mangohud
