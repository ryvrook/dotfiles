set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g history-limit 50000
setw -g mode-keys vi

# Carbonfox status bar
set -g status-style "bg=#0c0c0c,fg=#f2f4f8"
set -g status-left  "#[fg=#78a9ff,bold] #S "
set -g status-right "#[fg=#b6b8bb] %H:%M %d-%b "
set -g window-status-current-style "fg=#78a9ff,bold"
set -g pane-active-border-style "fg=#78a9ff"
set -g pane-border-style "fg=#484848"

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# vim-tmux-navigator (inlined; pairs with the nvim plugin)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# copy to system clipboard (Wayland)
set -s copy-command 'wl-copy'
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
